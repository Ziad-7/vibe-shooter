<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Shooter</title>
    <link rel="icon" type="image/png" href="logo.png">
    <meta property="og:title" content="Vibe Shooter">
    <meta property="og:description" content="A neon cyberpunk shooter with 2D and 3D modes! Survive the endless waves.">
    <meta property="og:image" content="https://vibe-shooter-z7.vercel.app/logo.png">
    <meta property="og:url" content="https://vibe-shooter-z7.vercel.app/">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="menu.css">
</head>
<body>
    <div class="menu-container">
        <h1 class="game-title">VIBE SHOOTER</h1>
        <div class="button-group">
            <a href="2d.html" class="menu-btn">2D Game</a>
            <a href="3d.html" class="menu-btn">3D Game</a>
        </div>
        <div id="highScores" style="margin-top: 30px; padding: 15px; border: 2px solid #00ffff; border-radius: 10px; background: rgba(0,255,255,0.1); color: #fff; font-family: sans-serif; text-shadow: 0 0 10px #00ffff; display: inline-block;">
            <h3 style="margin: 0 0 15px 0;">🏆 Leaderboard 🏆</h3>
            <p style="margin: 10px 0; font-size: 18px;">Best 2D Score: <strong id="best2d" style="color: #00ffff; font-size: 22px;">0</strong></p>
            <p style="margin: 10px 0; font-size: 18px;">Best 3D Score: <strong id="best3d" style="color: #ff00ff; font-size: 22px;">0</strong></p>
        </div>
    </div>
    
    <div class="audio-controls">
        <button id="toggleMusicBtn" class="audio-btn">🎵 Music: ON</button>
        <button id="toggleSfxBtn" class="audio-btn">🔊 SFX: ON</button>
    </div>

    <script src="audio.js"></script>
    <script>
        document.body.addEventListener('click', () => {
            window.AudioEngine.init();
            window.AudioEngine.playMusic();
        }, { once: true });

        const best2d = localStorage.getItem('vibeShooterBest2D') || 0;
        const best3d = localStorage.getItem('vibeShooterBest3D') || 0;
        document.getElementById('best2d').innerText = best2d;
        document.getElementById('best3d').innerText = best3d;

        const musicBtn = document.getElementById('toggleMusicBtn');
        const sfxBtn = document.getElementById('toggleSfxBtn');
        
        musicBtn.innerText = `🎵 Music: ${window.AudioEngine.state.musicMuted ? 'OFF' : 'ON'}`;
        sfxBtn.innerText = `🔊 SFX: ${window.AudioEngine.state.sfxMuted ? 'OFF' : 'ON'}`;

        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            window.AudioEngine.init();
            window.AudioEngine.playMusic();
            const muted = window.AudioEngine.toggleMusic();
            musicBtn.innerText = `🎵 Music: ${muted ? 'OFF' : 'ON'}`;
        });
        
        sfxBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            window.AudioEngine.init();
            const muted = window.AudioEngine.toggleSfx();
            sfxBtn.innerText = `🔊 SFX: ${muted ? 'OFF' : 'ON'}`;
        });
    </script>
</body>
</html>
