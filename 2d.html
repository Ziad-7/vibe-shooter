<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Shooter</title>
    <link rel="icon" type="image/png" href="logo.png">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Vibe Shooter - 2D Mode">
    <meta property="og:description" content="A neon cyberpunk shooter with 2D and 3D modes! Survive the endless waves.">
    <meta property="og:image" content="https://vibe-shooter-z7.vercel.app/logo.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="256">
    <meta property="og:image:height" content="256">
    <meta property="og:url" content="https://vibe-shooter-z7.vercel.app/2d.html">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="2d.css">
</head>
<body>
    <div id="scoreContainer">Score: <span id="scoreEl">0</span></div>
    <div id="comboUI" style="display: none;">Combo: x<span id="comboMultiplier">1</span></div>
    <div id="waveUI" class="center-banner" style="display: none;">WAVE 1</div>
    <div id="powerupUI" style="display: none;">
        🔥 Power-Up: <span id="powerupName">Spread Shot</span> (<span id="powerupTime">10</span>s)
    </div>
    <div id="mobileControls" style="display: none;">
        <div id="leftJoystickBase" class="joystick-base">
            <div id="leftJoystickKnob" class="joystick-knob"></div>
        </div>
        <div id="rightJoystickBase" class="joystick-base">
            <div id="rightJoystickKnob" class="joystick-knob"></div>
        </div>
    </div>
    <div id="gameOverModal" style="display: none;">
        <h1 id="finalScoreEl">0</h1>
        <p>Points</p>
        <p id="highScoreText" style="color: yellow; font-size: 24px; font-weight: bold; display: none; text-shadow: 0 0 10px yellow; margin: 10px 0;">🎉 New High Score! 🎉</p>
        <button id="restartBtn" class="primary-btn">Restart Game</button>
    </div>
    <a href="index.html" id="backToMenuBtn">Back to Menu</a>
    
    <div id="setupMenu" class="setup-modal">
        <h2>2D Game Setup</h2>
        
        <div class="setting-group">
            <label>Mode:</label>
            <select id="setupMode">
                <option value="centered">Centered</option>
                <option value="free">Free Movement</option>
            </select>
        </div>
        
        <div class="setting-group">
            <label>Difficulty:</label>
            <select id="setupDiff">
                <option value="easy">Easy</option>
                <option value="normal" selected>Normal</option>
                <option value="hard">Hard</option>
            </select>
        </div>
        
        <div class="setting-group">
            <label>Map Visuals:</label>
            <select id="setupMap">
                <option value="void">Dark Void</option>
                <option value="grid">Neon Grid</option>
                <option value="cyberpunk">Cyberpunk</option>
            </select>
        </div>
        
        <button id="startGameBtn" class="primary-btn">Start Game</button>
    </div>
    
    <div class="audio-controls">
        <button id="toggleMusicBtn" class="audio-btn">🎵 Music: ON</button>
        <button id="toggleSfxBtn" class="audio-btn">🔊 SFX: ON</button>
    </div>

    <canvas id="gameCanvas"></canvas>
    <script src="audio.js"></script>
    <script src="2d.js"></script>
</body>
</html>
